[project]
name = "crwallm"
version = "0.1.0"
description = "Local AI crawler — natural language or hand-written specs compiled into deterministic crawls"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "typer>=0.15",
    "httpx[http2,brotli,zstd]>=0.28",
    # Imported directly, not merely used through httpx: the DNS-pinning
    # transport subclasses its network backend.
    "httpcore>=1.0",
    # Imported directly for the Host-header middleware, rather than reached
    # through FastAPI.
    "starlette>=0.40",
    # The archive's compressor. httpx[zstd] happens to pull it, but that is
    # for decoding responses and could stop being true.
    "zstandard>=0.23",
    # The HTML parser everything above `extraction` is written against. It was
    # missing from this list while being imported by six modules, so a clean
    # install failed on the first page it tried to parse.
    "selectolax>=0.3.21",
    "tldextract>=5.1",
    # Chromium for the pages that only exist after their scripts run. The
    # browser binary is a separate download: `python -m playwright install
    # chromium`, which `crwallm setup` runs.
    "playwright>=1.49",
    # The desktop window. Uses the OS WebView - WebView2 on Windows, which
    # ships with Edge - so it adds no runtime for the user to install, unlike
    # bundling Chromium.
    "pywebview>=5.0",
    "pyyaml>=6.0",
    "rbloom>=1.5",
    "uvloop>=0.21; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    # Builds the single-file desktop binary. A build tool, not a runtime one.
    "pyinstaller>=6.11",
]

[project.scripts]
crwallm = "crwallm.cli.main:app"

# A console-less launcher. The icon starts this one, so double-clicking does
# not leave a black cmd window sitting behind the app for the person to wonder
# about and eventually close, taking the app with it.
[project.gui-scripts]
crwallm-desktop = "crwallm.desktop.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crwallm"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# ruff formats Python blocks inside Markdown. Documentation samples are
# aligned deliberately, so keep it out of docs.
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "TID",       # tidy-imports
    "RUF",
    "ASYNC",     # async correctness
    "S",         # bandit
]
ignore = [
    "S101",      # assert — tests use it
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
# The build script runs this interpreter and the binary it just produced, with
# argument lists it wrote itself. There is no untrusted input to check.
"packaging/**" = ["S603"]
# The network backend implements httpcore's interface verbatim; its
# timeout parameter is not ours to redesign into asyncio.timeout.
"src/crwallm/crawler/fetching/pinning.py" = ["ASYNC109"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Linux-only optional dependency; absent when type checking on Windows.
module = ["uvloop"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# basetemp is pinned inside the project: the system temp directory is not
# reliably writable on every developer machine, and a test suite that
# fails on where it puts scratch files teaches nothing.
addopts = "-q --strict-markers --basetemp=.pytest-tmp"
markers = [
    "integration: requires a running PostgreSQL",
    "e2e: full stack",
]
