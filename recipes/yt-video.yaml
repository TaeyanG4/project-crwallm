name: yt-video
version: 1
status: candidate
source: jsonld
source_url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
allowed_domains:
- youtube.com
container: VideoObject
fields:
- name: title
  selector: name
- name: url
  selector: '@id'
- name: thumbnail
  selector: thumbnailUrl
- name: uploaded
  selector: uploadDate
notes: paths taken from `crwallm inspect` - YouTube declares no duration or channel
