name: yt-video
version: 1
status: candidate
source: microdata
source_url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
allowed_domains:
- youtube.com
container: VideoObject
fields:
- name: title
  selector: name
- name: channel
  selector: author.name
- name: seconds
  selector: duration
  transform: [duration_to_seconds]
- name: url
  selector: url
filters:
- field: seconds
  op: between
  value: [60, 1800]
notes: |
  microdata rather than JSON-LD: the same page carries both and only the
  microdata has duration and channel. `duration_to_seconds` turns schema.org's
  PT3M34S into a number so the filter has something to compare.
