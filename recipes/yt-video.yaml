name: yt-video
version: 1
status: candidate
source: microdata
source_url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
allowed_domains:
- youtube.com
container: VideoObject
fields:
- name: title
  selector: name
- name: channel
  selector: author.name
- name: duration
  selector: duration
- name: uploaded
  selector: uploadDate
- name: url
  selector: url
- name: thumbnail
  selector: thumbnailUrl
- name: genre
  selector: genre
notes: |
  microdata rather than JSON-LD: the same page carries both, and only the
  microdata has duration and channel. Paths from `crwallm inspect`.
