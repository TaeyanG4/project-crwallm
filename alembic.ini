# Keep this file ASCII. configparser reads it with the *locale* encoding,
# so a single non-ASCII character in a comment makes every alembic command
# fail with a decode error on any machine whose locale is not UTF-8.
[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# URL comes from crwallm.config at runtime - see migrations/env.py
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
