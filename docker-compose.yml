name: crwallm

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crwallm
      POSTGRES_PASSWORD: crwallm
      POSTGRES_DB: crwallm
    # Bulk crawl writes are append-heavy and a crash may lose the last few
    # seconds of results. That is an acceptable trade for a personal crawler.
    # docs/12_PERFORMANCE.md §A③
    command: >
      postgres
      -c synchronous_commit=off
      -c max_connections=100
      -c shared_buffers=256MB
    ports:
      # 5433 by default: a local PostgreSQL install - or a WSL port relay -
      # already owns 5432 on plenty of machines, and losing the race there
      # produces a bind error rather than anything explanatory.
      - "127.0.0.1:${CRWALLM_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crwallm -d crwallm"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the container port is still 5432; only
      # the published host port moves.
      CRWALLM_DATABASE_URL: postgresql+asyncpg://crwallm:crwallm@db:5432/crwallm
      CRWALLM_API_HOST: 0.0.0.0   # container-internal; published to 127.0.0.1 only
      CRWALLM_API_TOKEN: ${CRWALLM_API_TOKEN:?set CRWALLM_API_TOKEN in .env}
      CRWALLM_ENV: ${CRWALLM_ENV:-dev}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./src:/app/src
      - ./recipes:/app/recipes
      - ./data:/app/data
    command: python -m crwallm.main

  # Phase 2. Runs in Linux so uvloop applies (docs/12_PERFORMANCE.md §A④).
  # worker:
  #   build: .
  #   depends_on: [db]
  #   environment:
  #     CRWALLM_DATABASE_URL: postgresql+asyncpg://crwallm:crwallm@db:5432/crwallm
  #   volumes: [./src:/app/src, ./data:/app/data]
  #   command: python -m crwallm.jobs.worker

  # The model server. Runs in the stack so a new machine needs nothing
  # installed - `docker compose --profile llm up -d` and that is the setup.
  #
  # GPU passthrough works through Docker Desktop's WSL2 backend on Windows and
  # nvidia-container-toolkit on Linux; verified on this machine with
  # `docker run --rm --gpus all nvidia/cuda:12.4.0-base nvidia-smi`. Comment
  # the `deploy` block out to run on CPU, which works and is slow enough that
  # you will notice.
  #
  # Optional in the larger sense too: levels 0 and 1 of
  # docs/02_PRODUCT_MODEL.md - hand-written recipes and picking detected
  # columns - need no model at all.
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports:
      - "127.0.0.1:${CRWALLM_OLLAMA_PORT:-11434}:11434"
    volumes:
      # Models live under the project rather than in the user profile, so a
      # checkout is one directory to back up, move or delete - and a 9GB model
      # is not stranded on whatever drive the home directory happens to be on.
      # data/ is gitignored.
      - "${CRWALLM_OLLAMA_MODELS:-./data/ollama}:/root/.ollama"
    environment:
      # Flash attention is a prerequisite for quantising the KV cache, and the
      # quantised cache is what buys a longer context on a card that would not
      # otherwise fit one (docs/08_LLM_ARCHITECTURE.md).
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      OLLAMA_KEEP_ALIVE: "-1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata:
